name: Lint Shell Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
      - name: Syntax check (bash -n)
        run: |
          for f in *.sh; do
            echo "Checking $f..."
            bash -n "$f"
          done
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - name: Check formatting (warning only)
        run: shfmt -d -i 2 -ci *.sh || echo "::warning::shfmt found formatting differences"
        continue-on-error: true
